<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bodicherla Venkata Sai Siva Kumar | Portfolio</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui, sans-serif}
body{background:#dbeafe;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}
.card{background:white;width:100%;max-width:1000px;border-radius:32px;padding:40px;display:flex;gap:30px}
.left{flex:1}
.badge{background:#dbeafe;color:#1e3a8a;padding:8px 20px;border-radius:20px;display:inline-block;font-size:14px}
h1{font-size:48px;line-height:1.1;color:#0f172a;margin-bottom:15px;text-transform:uppercase;font-weight:800}
.sub{font-size:20px;font-weight:700;margin-bottom:15px}
.desc{color:#475569;font-size:18px;line-height:1.6;margin-bottom:25px}
.skills{margin-top:25px;font-weight:600;color:#334155}
.right{flex:1;display:flex;justify-content:center;align-items:center}
.right img{width:100%;max-width:380px;border-radius:30px;box-shadow:0 15px 30px rgba(0,0,0,0.15);pointer-events:none;user-select:none}
@media(max-width:768px){.card{flex-direction:column-reverse;padding:25px} h1{font-size:35px} .right img{max-width:100%}}
</style>
</head>
<body>
<div class="card">
<div class="left">
<div class="badge">Available for Opportunities</div>
<h1>Bodicherla Venkata Sai Siva Kumar</h1>
<div class="sub">B.Tech 4th Year | Aspiring Web Developer</div>
<div class="desc">Passionate about building responsive web applications. Focused on React, JavaScript and modern UI/UX.</div>
<div class="skills">React | Python | Web Development</div>
</div>
<div class="right">

</div>
</div>
</body>
